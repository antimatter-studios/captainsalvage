# Windows itself as the oracle for the NTFS flows. Opt-in: it runs when a pull request is given the
# `windows-oracle` label, or by hand from the Actions tab, and is not part of the required CI check.
#
# A hosted Windows runner formats and fills NTFS volumes (validation/windows/make-volume.ps1) and
# writes down what Windows says they hold. A Linux job then has the app read the same images and
# compares (crates/captainsalvage/tests/ntfs_windows.rs). The app itself links macOS and Unix
# libraries, so it is not built on Windows. `chore test:windows-oracle` does both steps in the
# Windows guest of fs-windows-test-harness on a developer's machine.
name: Windows oracle

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows formats and fills the NTFS volumes
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'windows-oracle'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows formats and fills six volumes
        shell: bash
        env:
          FSWTH_LOCAL: "1"
        run: bash validation/windows/capture.sh "$RUNNER_TEMP/windows-oracle"
      # Synthetic volumes, kept for a day so the next job can read them. They hold generated bytes only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-oracle-volumes
          path: ${{ runner.temp }}/windows-oracle
          if-no-files-found: error
          retention-days: 1

  graded:
    name: the app reads them as Windows listed them
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-oracle-volumes
          path: windows-oracle
      - name: the NTFS tests graded by Windows
        env:
          WINDOWS_ORACLE_DIR: ${{ github.workspace }}/windows-oracle
        run: cargo test --locked -p captainsalvage --features windows-oracle --test ntfs_windows
