name: CI

# The engine and the window build run on Linux, where minutes cost a tenth of macOS's on a
# private repository. Only what needs macOS runs there: the app itself, which links macOS
# frameworks, the Finder extension and the release tools. The job named CI waits for all of them,
# so branch protection keeps one required check. The engine's work is three jobs that run side by side, each
# well under the time the self-hosted runner lets a job live (it was lost at about 18 to 28 minutes, and left no
# log, while this was one job of about 20): the window and the lints, the engine's tests, and the tests with the
# test hooks and the doc tests. Another job runs the independent NTFS, FAT and exFAT oracles in a Linux VM,
# and one checks what the tests run of our code against its baseline. Documentation-only changes skip all of it.
#
# Every job takes its runner from a gate job of its own, `<job>-gate`, which runs on the runner gate
# (`runs-on: antimatter-vps-gate`) and says which runner the job gets. The gate never fails a job, and a
# fork's pull request gets GitHub's runner. The CI job below runs when its needs fail, so its gate does too,
# and it falls back to `ubuntu-latest` when its gate was skipped.
on:
  pull_request:
    paths-ignore: ["**.md", "media/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "media/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  engine:
    name: engine and window
    needs: engine-gate
    runs-on: ${{ needs.engine-gate.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install Python when missing
        run: |
          if ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi
      - name: unreleased changes are fragments
        run: bash scripts/changelog-check.sh
      - name: every window string is translated
        run: python3 scripts/check_translations.py
      - name: every file carries the one version in VERSION
        run: python3 scripts/release.py check
      # Only warns. A fragment or the release's notes that use a retired word are fixed in the pull
      # request that wrote them, and the cut stage of scripts/create-release is what refuses them.
      - name: release notes avoid the retired words (warning only)
        run: python3 scripts/release.py notes-check
      - name: engine text is translated sentence by sentence
        run: bash scripts/test_translations.sh
      - name: type check and build the window
        run: npm run build
      - name: the window's logic and its raw-disk speed budget
        run: node --test tests/*.mjs
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: every library has an allowed license
        run: |
          python3 scripts/test_licenses.py
          cargo deny --locked check licenses
          python3 scripts/licenses.py check
          python3 scripts/licenses.py current
      - name: formatting
        run: cargo fmt --all --check
      - name: lint the engine
        run: cargo clippy -p captainsalvage --all-targets --locked -- -D warnings

  engine-tests-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  engine-tests:
    # `cargo test -p captainsalvage --locked` is these targets and the doc tests of the job after this one: the library, the
    # binaries and every integration test.
    name: engine tests
    needs: engine-tests-gate
    runs-on: ${{ needs.engine-tests-gate.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install Python when missing
        run: |
          if ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi
      # ffmpeg is a tool the tests run, never linked or shipped: the app uses the one a person installed. Without it
      # every test that needs a real ffmpeg skips itself and only the path of a Mac without one runs. That path has
      # a test of its own that hides ffmpeg explicitly, so both paths run here.
      - name: install ffmpeg, so the tests that need it run instead of being skipped
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: test the engine
        run: cargo test -p captainsalvage --locked --lib --bins --tests

  engine-hooks-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  engine-hooks:
    # The doc tests of the engine, and the engine with the test hooks, which only the window tests' build has: one step per
    # command, so a job that is lost says which command it was running.
    name: engine tests with the test hooks
    needs: engine-hooks-gate
    runs-on: ${{ needs.engine-hooks-gate.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install Python when missing
        run: |
          if ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi
      # ffmpeg is a tool the tests run, never linked or shipped: the app uses the one a person installed. Without it
      # every test that needs a real ffmpeg skips itself and only the path of a Mac without one runs. That path has
      # a test of its own that hides ffmpeg explicitly, so both paths run here.
      - name: install ffmpeg, so the tests that need it run instead of being skipped
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: test the engine's doc tests
        run: cargo test -p captainsalvage --locked --doc
      - name: lint the engine with the test hooks
        run: cargo clippy -p captainsalvage --all-targets --locked --features test-hooks -- -D warnings
      - name: test the test hooks
        run: cargo test -p captainsalvage --locked --features test-hooks --test test_hooks
      - name: test the engine's own tests with the test hooks
        run: cargo test -p captainsalvage --locked --features test-hooks --lib

  oracle-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  oracle:
    # `chore test:oracle`: the NTFS flows against ntfs-3g's tools and the Linux kernel's ntfs3
    # driver, and the FAT and exFAT flows against mkfs.fat, mkfs.exfat, mtools and the kernel's
    # vfat and exfat drivers, in the fs-linux-test-harness VM. Only an x86_64 runner has KVM, and
    # ci-setup-linux.sh is the harness's one setup for it, run from the sibling checkout.
    name: independent oracles (NTFS, FAT and exFAT, harness VM)
    needs: oracle-gate
    runs-on: ${{ needs.oracle-gate.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install chore and check out the sibling repositories
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github.com/antimatter-studios/chore/releases/download/v0.11.0/chore-0.11.0-linux-x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin chore
          chore siblings
      - name: KVM, QEMU, virtiofsd and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore test:oracle
        id: oracle
        run: chore test:oracle
      # Sessions leave the shared guest up. Stop it on this ephemeral runner.
      - name: Stop the idle shared guest
        if: always() && steps.oracle.outcome != 'skipped'
        run: chore linux:down

  app-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick macos-arm64

  app:
    name: app on macOS
    needs: app-gate
    runs-on: ${{ needs.app-gate.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The app embeds the built window, so it is built here too.
      - name: build the window
        run: npm run build
      - name: test the release tools
        run: |
          python3 scripts/test_release.py
          bash scripts/test_changelog_fragment.sh
          bash scripts/test_create_release.sh
          bash scripts/test_tag_kind.sh
      - name: the Finder extension type checks
        run: |
          swiftc -typecheck -parse-as-library -application-extension macos/finder/Extension.swift
      - name: lint the app, and the engine on macOS
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: lint the app with the test hooks
        run: cargo clippy -p captain-salvage --all-targets --locked --features test-hooks -- -D warnings
      # The shipped app has none of the hooks that drive its window in tests. The normal build
      # is checked to hold none, then the test-hooks build to hold them all.
      - name: the normal app holds no test hook
        run: |
          cargo build -p captain-salvage --locked
          scripts/check-test-hooks.sh absent target/debug/captain-salvage
      - name: the test-hooks app holds the test hooks
        run: |
          cargo build -p captain-salvage --locked --features test-hooks
          scripts/check-test-hooks.sh present target/debug/captain-salvage

  coverage-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick macos-arm64

  coverage:
    # What the tests run of our own code, against docs/coverage-baseline.json (`chore test:coverage`).
    # One job, on macOS because the Tauri crate only builds there, and cached like the others. The VM
    # and window tests are not run, so the numbers are of the engine's tests, the Tauri crate's own
    # tests and the TypeScript tests.
    name: coverage against the baseline
    needs: coverage-gate
    runs-on: ${{ needs.coverage-gate.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests that need a real ffmpeg run here too, as in the engine job, so they are in the numbers.
      - name: install ffmpeg, so the tests that need it run instead of being skipped
        run: brew install ffmpeg
      # The app embeds the built window, so it is built before the Tauri crate is.
      - name: build the window
        run: npm run build
      - name: the coverage gate itself is tested
        run: python3 scripts/test_coverage.py
      - name: coverage is not under the baseline
        run: python3 scripts/coverage.py check

  ci-gate:
    needs: [engine, engine-tests, engine-hooks, app, oracle, coverage]
    if: always()
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  ci:
    name: CI
    needs: [engine, engine-tests, engine-hooks, app, oracle, coverage, ci-gate]
    if: always()
    runs-on: ${{ needs.ci-gate.outputs.runner || 'ubuntu-latest' }}
    steps:
      - name: all passed
        run: |
          for result in '${{ needs.engine.result }}' '${{ needs.engine-tests.result }}' '${{ needs.engine-hooks.result }}' '${{ needs.app.result }}' '${{ needs.oracle.result }}' '${{ needs.coverage.result }}'; do
            case "$result" in success) ;; *) echo "::error::a job ended with $result"; exit 1 ;; esac
          done
