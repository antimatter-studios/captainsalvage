name: release

# Pushing a version tag builds, tests and publishes that version. Its notes are that
# version's CHANGELOG.md section. Running this by hand is a dry run: everything except
# publishing.
#
# A release candidate, v0.4.0-rc1, is not a version: it is a build to try before the release's pull
# request merges, so it is tagged on a commit that is not on main, and nothing here runs for it. The
# second tag pattern leaves it out, and scripts/test_release.py holds the two patterns to
# scripts/tag-kind, the one place that says what a tag may look like. The pattern leaves out only a
# well-formed candidate. A tag that merely looks like one, v0.4.0-RC1 or v0.4.0-rc0, still starts
# this, and the first step then refuses it by name rather than letting it be taken for a release.
#
# Builds never go on GitHub, as a release asset or a workflow artifact, because anyone who can
# read the repository could download them, and this app will be sold. They go straight from the
# job that built them to private storage. That step is below, turned off until the bucket
# exists, so until then a release has notes and no build.
#
# Every job takes its runner from a gate job of its own, `<job>-gate`, which runs on the runner gate
# (`runs-on: antimatter-vps-gate`) and says which runner the job gets. A job that has an `if:` gives its
# gate the same one.
on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-rc[1-9]*"
  workflow_dispatch:

# Every job reads, and one job writes. The writing job checks nothing out and runs
# nothing from the repository. Actions are pinned to commits, because a tag can move.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick macos-arm64

  build:
    name: build and test
    needs: build-gate
    runs-on: ${{ needs.build-gate.outputs.runner }}
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: check the tag
        if: github.event_name == 'push'
        run: |
          # An unrecognised name is refused here, by name. A candidate is not built or published here.
          kind="$(scripts/tag-kind "$GITHUB_REF_NAME")"
          [ "$kind" = final ] || {
            echo "$GITHUB_REF_NAME is a $kind, and only a final release is built and published here" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "$GITHUB_REF_NAME is not on main" >&2
            exit 1
          }
          python3 scripts/release.py check "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install ffmpeg, so its tests run instead of being skipped
        run: brew install ffmpeg
      - name: test the release tool
        run: python3 scripts/test_release.py
      - name: formatting
        run: cargo fmt --all --check
      - name: type check and build the window
        run: npm run build
      - name: lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test -p captainsalvage --locked
      - name: build the app
        run: python3 scripts/release.py build
      # The app that ships has no test hooks. Its window tests run against a test-hooks build of
      # the same commit, which this build never is.
      - name: the shipped app holds no test hook
        run: scripts/check-test-hooks.sh absent "target/release/bundle/macos/Captain Salvage.app"
      - name: package it
        run: |
          label="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_EVENT_NAME" = push ] || label="dry-run"
          name="Captain-Salvage-$label-macos-arm64.zip"
          mkdir out
          ditto -c -k --keepParent "target/release/bundle/macos/Captain Salvage.app" "out/$name"
          (cd out && shasum -a 256 "$name" > "$name.sha256")
      # The notes are this version's CHANGELOG.md section, through the same code the pre-push
      # guard checks the tag with, so the two cannot disagree.
      - name: the CHANGELOG describes this version
        if: github.event_name == 'push'
        uses: antimatter-studios/agent-skills/.github/actions/changelog-notes@ed0b96812c5908478dcd84543debf4d5f8bf87e3
        with:
          tag: ${{ github.ref_name }}
          output-file: ${{ github.workspace }}/out/release-notes.md
      - name: show the release notes
        if: github.event_name == 'push'
        run: cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: keep the notes for the publish job
        id: notes
        if: github.event_name == 'push'
        run: |
          delimiter="notes-$(uuidgen)"
          { echo "body<<$delimiter"; cat out/release-notes.md; echo; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      # Turned off until the bucket exists. To turn it on, uncomment this and add these to the
      # repository's Actions settings:
      #   variables: S3_ENDPOINT, S3_BUCKET, S3_REGION
      #   secrets:   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      # Give that key write access to this one bucket and nothing else. The secrets are set on
      # this step only, so the build steps before it cannot read them.
      # - name: upload the build to private storage
      #   if: github.event_name == 'push'
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      #     AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
      #     S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      #     S3_BUCKET: ${{ vars.S3_BUCKET }}
      #   run: |
      #     for file in out/*.zip out/*.sha256; do
      #       aws s3 cp "$file" "s3://$S3_BUCKET/captain-salvage/$GITHUB_REF_NAME/" --endpoint-url "$S3_ENDPOINT"
      #     done

  publish-gate:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  publish:
    name: publish
    needs: [build, publish-gate]
    if: github.event_name == 'push'
    runs-on: ${{ needs.publish-gate.outputs.runner }}
    permissions:
      contents: write
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          [ -n "$NOTES" ] || { echo "::error::the build job passed on no release notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Captain Salvage ${GITHUB_REF_NAME#v}" \
            --notes "$NOTES"
