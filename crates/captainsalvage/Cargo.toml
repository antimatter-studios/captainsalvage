[package]
name = "captainsalvage"
version = "0.25.0"
license = "MIT"
edition = "2021"
autobins = false

[lib]
name = "captainsalvage"
path = "src/lib.rs"

[[bin]]
name = "captainsalvage"
path = "src/bin/captainsalvage.rs"

[dependencies]
anyhow = "1.0.104"
bzip2-rs = "0.1.2"
flate2 = "1.1.10"
fs-core = { package = "rust-fs-core", version = "=0.4.5" }
# The FAT and SquashFS drivers are built on the next rust-fs-core, whose BlockRead is another trait than 0.4.5's, which the exFAT and
# NTFS drivers still use. A device implements both until every driver is on this one. The drivers must agree on its exact version.
fs-core-layers = { package = "rust-fs-core", version = "=0.5.1", features = ["layers"] }
fs-exfat = { package = "rust-fs-exfat", git = "https://github.com/antimatter-studios/rust-fs-exfat", rev = "84956aaf3317ef98767425cf4c2a2ab528ae1b02" }
fs-erofs = { package = "rust-fs-erofs", git = "https://github.com/antimatter-studios/rust-fs-erofs", rev = "0204627bb5f70a3552ee2bce0d29f94cb56cfa11" }
fs-ext4 = { package = "rust-fs-ext4", git = "https://github.com/antimatter-studios/rust-fs-ext4", rev = "4c70f07b311a87792b5b3efc8694c56f77301da1" }
fs-fat32 = { package = "rust-fs-fat32", git = "https://github.com/antimatter-studios/rust-fs-fat", rev = "0159f5c72a0b23359a5963ff452c83ad80001a36" }
fs-ntfs = { package = "rust-fs-ntfs", git = "https://github.com/antimatter-studios/rust-fs-ntfs", rev = "6be01d961d4b3e61faeb2454e7f37b5af661c970" }
fs-squashfs = { package = "rust-fs-squashfs", git = "https://github.com/antimatter-studios/rust-fs-squashfs", rev = "d17048f55aded8c23cb78f19f01c807bc027d30a" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
libc = "0.2.191"
rars = { version = "0.12.4", default-features = false }
rhai = { version = "1.27.0", features = ["serde", "sync"] }
ruzstd = "0.9.1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
sha2 = "0.11.1"
tar = "0.4.46"
tiny_http = "0.12.0"
xz4rust = "0.2.3"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2", "deflate64", "aes-crypto"] }

[dev-dependencies]
# An independent NTFS reader, only to check the app against: it is never linked into the app.
ntfs = { version = "0.4", default-features = false, features = ["std"] }
fs-exfat = { package = "rust-fs-exfat", git = "https://github.com/antimatter-studios/rust-fs-exfat", rev = "84956aaf3317ef98767425cf4c2a2ab528ae1b02", features = ["test-support"] }
# Only to build archives for the tests: the app itself never writes one.
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
rars = { version = "0.12.4", default-features = false, features = ["write"] }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd", "compress", "util"] }

# Tests that need the independent oracles: ntfs-3g's tools and the Linux kernel's ntfs3 driver,
# and dosfstools, exfatprogs, mtools and the kernel's vfat and exfat drivers, which run in the
# Linux test VM. They fail, never skip, when the oracles cannot run:
# `chore test:oracle` provides them.
[features]
oracle = []

# Hooks for driving the window in tests (`tests/window/`). Off in every build that is shipped or
# installed: without the feature this code is not compiled, so the app has no way to run script
# in its window, no test environment variables and no refused-copy guard.
test-hooks = []

# Tests graded by Windows itself: Windows formats and fills NTFS volumes (validation/windows), and
# the app must read them as Windows listed them. They fail, never skip, when Windows cannot be
# reached: `chore test:windows-oracle` provides the Windows guest.
windows-oracle = []

[[test]]
name = "ntfs_oracle"
required-features = ["oracle"]

[[test]]
name = "fat_exfat_oracle"
required-features = ["oracle"]

[[test]]
name = "squashfs_oracle"
required-features = ["oracle"]

[[test]]
name = "ext4_oracle"
required-features = ["oracle"]

[[test]]
name = "erofs_oracle"
required-features = ["oracle"]

[[test]]
name = "ntfs_windows"
required-features = ["windows-oracle"]
