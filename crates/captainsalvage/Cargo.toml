[package]
name = "captainsalvage"
version = "0.3.0"
license = "MIT"
edition = "2021"
autobins = false

[lib]
name = "captainsalvage"
path = "src/lib.rs"

[[bin]]
name = "captainsalvage"
path = "src/bin/captainsalvage.rs"

[dependencies]
anyhow = "1.0.104"
bzip2-rs = "0.1.2"
flate2 = "1.1.10"
fs-core = { package = "rust-fs-core", version = "=0.4.3" }
fs-exfat = { package = "rust-fs-exfat", git = "https://github.com/antimatter-studios/rust-fs-exfat", rev = "6b63a7d142626d0fcf9804514abf1defb4730924" }
fs-fat32 = { package = "rust-fs-fat32", git = "https://github.com/antimatter-studios/rust-fs-fat", rev = "71a6572d64ae4ac903a52b376e7d725c70fb9d99" }
fs-ntfs = { package = "rust-fs-ntfs", git = "https://github.com/antimatter-studios/rust-fs-ntfs", rev = "a54a99151e22b3f146f0c29a51edc1f4a200cb83" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
libc = "0.2.191"
rars = { version = "0.12.4", default-features = false }
rhai = { version = "1.27.0", features = ["serde", "sync"] }
ruzstd = "0.9.1"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
sha2 = "0.11.1"
tar = "0.4.46"
tiny_http = "0.12.0"
xz4rust = "0.2.3"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2", "deflate64", "aes-crypto"] }

[dev-dependencies]
fs-exfat = { package = "rust-fs-exfat", git = "https://github.com/antimatter-studios/rust-fs-exfat", rev = "6b63a7d142626d0fcf9804514abf1defb4730924", features = ["test-support"] }
# Only to build archives for the tests: the app itself never writes one.
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "encoder"] }
rars = { version = "0.12.4", default-features = false, features = ["write"] }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd", "compress", "util"] }
