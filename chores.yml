version: "3"
chore_min_version: 0.10.0

# The tasks that need the Linux test VM. Everything else is plain `cargo`, and `scripts/`.
#
# `chore test:oracle` checks NTFS against two implementations nobody here wrote: ntfs-3g's own
# tools and the Linux kernel's ntfs3 driver, in the fs-linux-test-harness guest. It checks FAT12,
# FAT16, FAT32 and exFAT against mkfs.fat, mkfs.exfat, the kernel's vfat and exfat drivers, mtools
# and fsck, and SquashFS against mksquashfs and the kernel's squashfs driver. Nothing is mounted on
# this machine. See validation/oracle.sh and crates/captainsalvage/tests/ntfs_oracle.rs,
# validation/fat-oracle.sh and crates/captainsalvage/tests/fat_exfat_oracle.rs, and
# validation/squashfs-oracle.sh and crates/captainsalvage/tests/squashfs_oracle.rs.
#
# `chore test:windows-oracle` checks it against Windows itself: Windows formats and fills NTFS
# volumes in the Windows guest of fs-windows-test-harness, and reports what it wrote. See
# validation/windows/ and crates/captainsalvage/tests/ntfs_windows.rs.

vars:
  # The harness and the core checkout its scripts expect, as siblings of this repository.
  # They are tools this repository runs, not cargo dependencies, so these two lines are the only
  # thing that decides which versions run, and CI reads them here too.
  LINUX_HARNESS_REF: v0.11.0
  FS_CORE_REF: v0.4.2
  # The Windows guest's harness, a sibling that only `windows:up` and the Windows oracle use.
  WINDOWS_HARNESS_REF: v4.6.0

# The harness's own tasks, as `chore linux:<task>` (linux:up, linux:run, linux:down ...).
# Optional, because `chore siblings` is what checks the harness out.
includes:
  linux:
    taskfile: ../fs-linux-test-harness/vm.chores.yml
    optional: true

# Reap dead runs and unfinished boots; a healthy shared guest stays up for the next consumer.
lifecycle:
  after_all:
    - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh reap'

tasks:
  siblings:
    desc: Check out the sibling repositories the oracle tests run from, at their pinned tags
    # It refuses to move a sibling that has uncommitted work, and says nothing when they are
    # already where the pins say.
    cmds:
      - |
        set -eu
        printf '%s\t%s\t%s\n' \
          rust-fs-core          https://github.com/antimatter-studios/rust-fs-core.git          '{{.FS_CORE_REF}}' \
          fs-linux-test-harness https://github.com/antimatter-studios/fs-linux-test-harness.git '{{.LINUX_HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="../$name"
            if [ ! -e "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git clone --quiet --branch "$ref" "$url" "$dir"
              continue
            fi
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes, so it is not moved." >&2
              exit 1
            fi
            if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}" 2>/dev/null || echo x)" ]; then
              continue
            fi
            echo "siblings: moving $name to $ref"
            git -C "$dir" fetch --quiet --tags origin
            git -C "$dir" checkout --quiet "$ref"
          done

  test:oracle:
    desc: "Independent validation: ntfs-3g, mkfs.fat, mkfs.exfat, mksquashfs, mke2fs, mtools and the kernel's ntfs3, vfat, exfat, squashfs and ext4 read what the NTFS, FAT, exFAT, SquashFS and ext2/3/4 flows read, in the Linux test VM"
    deps: [siblings]
    # `up` boots the shared guest and applies scripts/vm-setup.sh; the session detaches when cargo
    # ends, however it ends, and leaves the guest up for the next user. A missing VM, tool or
    # driver fails the tests that needed it. Nothing skips.
    cmds:
      - ../fs-linux-test-harness/scripts/vm.sh up
      - ../fs-linux-test-harness/scripts/vm.sh session cargo test --locked -p captainsalvage --features oracle --test ntfs_oracle --test fat_exfat_oracle --test squashfs_oracle --test ext4_oracle

  test:coverage:
    desc: "What the tests run of our own code (Rust engine, Tauri crate, TypeScript), checked against docs/coverage-baseline.json"
    # Instruments and runs the whole workspace's tests and the TypeScript tests, so it takes as long as
    # both, twice over. It needs `cargo install cargo-llvm-cov` and `rustup component add llvm-tools-preview`
    # (the repository's toolchain). It fails when a part is more than the tolerance under the baseline. The VM
    # and window tests are not run, so they add nothing here. See scripts/coverage.py.
    cmds:
      - python3 scripts/coverage.py check

  coverage:baseline:
    desc: "Measure and write docs/coverage-baseline.json (refuses outside CI; from CI's numbers use `scripts/coverage.py baseline --from-log`)"
    cmds:
      - python3 scripts/coverage.py baseline

  siblings:windows:
    desc: Check out the Windows test harness beside this repository, at its pinned tag
    cmds:
      - |
        set -eu
        dir=../fs-windows-test-harness
        ref='{{.WINDOWS_HARNESS_REF}}'
        if [ ! -e "$dir/.git" ]; then
          echo "siblings:windows: cloning fs-windows-test-harness at $ref"
          git clone --quiet --branch "$ref" https://github.com/antimatter-studios/fs-windows-test-harness.git "$dir"
          exit 0
        fi
        # A harness checkout that is already there is the one the Windows guest was built from. It
        # is moved only when it is clean, and not at all when it is a development checkout on a branch.
        if [ -n "$(git -C "$dir" status --porcelain)" ]; then
          echo "siblings:windows: fs-windows-test-harness has uncommitted changes, so it is not moved." >&2
          exit 1
        fi
        if [ "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" rev-parse "$ref^{commit}" 2>/dev/null || echo x)" ]; then
          exit 0
        fi
        if [ "$(git -C "$dir" rev-parse --abbrev-ref HEAD)" != HEAD ]; then
          echo "siblings:windows: fs-windows-test-harness is on a branch, so it is left as it is."
          exit 0
        fi
        git -C "$dir" fetch --quiet --tags origin
        git -C "$dir" checkout --quiet "$ref"

  windows:up:
    desc: Start the Windows guest of fs-windows-test-harness and wait until it answers
    deps: [siblings:windows]
    # Setting the guest up the first time is the harness's own README (`local-vm.py prepare`, `up
    # --install`, `provision`). Starting a prepared guest takes about a minute, and a running one
    # is reused.
    cmds:
      - python3 ../fs-windows-test-harness/scripts/local-vm.py up
      - python3 ../fs-windows-test-harness/scripts/local-vm.py wait

  test:windows-oracle:
    desc: "Windows itself as the oracle: Windows formats and fills NTFS volumes, and the app must read them as Windows listed them"
    deps: [windows:up]
    # The test runs validation/windows/capture.sh, which has the guest format six volumes (512-byte
    # and 4096-byte sectors, 512 to 65536-byte clusters, 24 to 320 MiB), fill each with a fixed tree
    # and write down what Windows says it holds, then ships the images back to `.windows-oracle/`
    # (git ignores it). About three minutes of Windows, then the grading. A guest that cannot be
    # reached fails the tests; nothing skips. WINDOWS_ORACLE_DIR=<folder> grades a folder an earlier
    # run (or the hosted-runner workflow) filled, without asking Windows again.
    cmds:
      - cargo test --locked -p captainsalvage --features windows-oracle --test ntfs_windows

  # The project overview: every repository listed in scripts/constellation-repositories.sh,
  # read from GitHub. No `sources` on any of these: the answer lives on GitHub and changes when
  # somebody files an issue or opens a pull request, so no file here can say it is up to date.
  # Each repository's answer is kept for AM_GITHUB_CACHE_TTL seconds (600); -- --no-cache asks anyway.
  overview:summary:
    desc: Counts only, one row per repository, no issue detail
    cmds:
      - scripts/am-overview --summary {{.CLI_ARGS}}

  overview:list:
    desc: Every repository in turn, each with its issue numbers, titles and pull requests
    cmds:
      - scripts/am-overview --list {{.CLI_ARGS}}

  overview:tsv:
    desc: The detail rows as TSV, for piping somewhere else
    cmds:
      - scripts/am-overview --tsv {{.CLI_ARGS}}

  pr:list:
    desc: Every pull request across the repositories (add -- --state open, --tsv, ...)
    cmds:
      - scripts/am-prs {{.CLI_ARGS}}

  pr:external:
    desc: Pull requests opened by external contributors (add -- --state open, --tsv, ...)
    cmds:
      - scripts/am-prs --external {{.CLI_ARGS}}

  queue:list:
    desc: Every pull request waiting in a merge queue across the repositories (add -- --tsv, --project NAME, --no-cache)
    cmds:
      - scripts/am-queue {{.CLI_ARGS}}

  issue:list:
    desc: Every open issue across the repositories, oldest first, as JSON (add -- --unclaimed, --urls, --prs, --no-cache, ...)
    cmds:
      - scripts/am-issues {{.CLI_ARGS}}

  check:overview-scripts:
    desc: The overview scripts' own tests, against fixtures (no GitHub)
    cmds:
      - for t in scripts/tests/*.sh; do bash "$t" || exit 1; done
