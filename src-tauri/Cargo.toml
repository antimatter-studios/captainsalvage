[package]
name = "captain-salvage"
version = "0.1.0"
license = "MIT"
edition = "2021"

[lib]
name = "captain_salvage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
salvage-core = { path = "../crates/salvage-core" }
objc2 = "0.6.5"
objc2-file-provider = { version = "0.3.2", default-features = false, features = ["std", "block2", "Extension", "NSFileProviderDomain", "NSFileProviderItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSArray", "NSError", "NSString"] }
block2 = "0.6.2"
