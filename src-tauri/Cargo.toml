[package]
name = "captain-salvage"
version = "0.16.1"
license = "MIT"
edition = "2021"

[lib]
name = "captain_salvage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Hooks for driving the window in tests. Never part of a release or an installed app.
test-hooks = ["captainsalvage/test-hooks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
captainsalvage = { package = "captainsalvage", path = "../crates/captainsalvage" }
objc2 = "0.6.5"
objc2-file-provider = { version = "0.3.2", default-features = false, features = ["std", "block2", "Extension", "NSFileProviderDomain", "NSFileProviderItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSArray", "NSError", "NSString", "NSProcessInfo"] }
block2 = "0.6.2"
