[package]
name = "exfat-lens"
version = "0.1.0"
edition = "2021"

[lib]
name = "exfat_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lens-core = { path = "../crates/lens-core" }
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
