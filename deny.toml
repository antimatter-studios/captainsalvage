# What `cargo deny check licenses` allows. Captain Salvage is meant to be sold, so every
# crate it is built from must be usable under a permissive license. MIT is preferred; see
# "Libraries and licenses" in the README. Nothing from the GPL family is allowed.
[graph]
exclude-dev = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Weak copyleft, per file: allowed for libraries used unmodified.
    "MPL-2.0",
    # A BSD-style license.
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true
